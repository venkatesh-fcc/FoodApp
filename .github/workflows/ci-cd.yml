name: Spring Boot CI/CD pipeline
on:
  push:
    paths:
      - 'src/main/java/**'

  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------
  # 1. CONTINUOUS INTEGRATION (CI) JOB
  # -------------------------------------------------------
  ci-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application Package
        run: mvn -B package -DskipTests
  # -------------------------------------------------------
  # 2. CONTINUOUS DEPLOYMENT (CD) JOB
  # -------------------------------------------------------
  cd-deploy:
    needs: ci-build-and-test # Only runs if CI job passes successfully
    if: github.event_name == 'push' # Avoid deploying code from Pull Requests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/FoodApp:welcome

      - name: Final Confirmation
        run: echo "file pushed to docker successfully!!"


